name: Build and Release AROMA-Next Installer

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c

      - name: Build arm64-v8a and armeabi-v7a binaries
        run: |
          ${{ steps.setup-ndk.outputs.ndk-path }}/ndk-build \
            NDK_PROJECT_PATH=. \
            APP_BUILD_SCRIPT=Android.mk \
            NDK_APPLICATION_MK=Application.mk \
            -j$(nproc)
          mkdir -p out/bin
          cp libs/arm64-v8a/aroma_installer out/bin/aroma_installer-arm64
          cp libs/armeabi-v7a/aroma_installer out/bin/aroma_installer-arm32

      - name: Package flashable ZIPs
        run: |
          mkdir -p dist staging_rec staging_magisk
          cp -r assets/* staging_rec/
          rm -f staging_rec/META-INF/CERT.* staging_rec/META-INF/MANIFEST.MF
          mkdir -p staging_rec/META-INF/com/google/android/bin
          cp out/bin/aroma_installer-arm64 staging_rec/META-INF/com/google/android/bin/
          cp out/bin/aroma_installer-arm32 staging_rec/META-INF/com/google/android/bin/
          (cd staging_rec && zip -r9 ../dist/AROMA-Next-Installer.zip .)

          cp -r staging_rec/* staging_magisk/
          rm -f staging_magisk/META-INF/com/google/android/update-binary-installer
          cp -rf magisk-template/* staging_magisk/
          (cd staging_magisk && zip -r9 ../dist/AROMA-Next-Magisk-Template.zip .)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aroma-next-binaries-and-zips
          path: |
            out/bin/*
            dist/*.zip

      - name: Create GitHub Release (Tag or Rolling Latest)
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'AROMA-Next Installer (Latest Build)' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') || contains(github.ref_name, '-') }}
          generate_release_notes: true
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-') && 'true' || 'false' }}
          files: |
            dist/AROMA-Next-Installer.zip
            dist/AROMA-Next-Magisk-Template.zip
            out/bin/aroma_installer-arm64
            out/bin/aroma_installer-arm32
